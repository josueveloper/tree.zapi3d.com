  /* El sapito es el cuerpo; los enlaces son sus capas. */
  .sapito { display: block; width: 100%; height: auto; }
  .sapito .cuerpo { fill: var(--verde); }
  .sapito .ojo { fill: var(--ojos); }
  .sapito .sonrisa { stroke: var(--acento); }

  .capas { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .capas a {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 64px;
    padding: 12px 20px;
    border-radius: 6px;
    background: var(--verde);
    color: var(--sobre-verde);
    text-decoration: none;
    transform-origin: left center;
    transition: background-color 150ms ease;
  }
  .capas li:last-child a { border-radius: 6px 6px 16px 16px; }
  .capas a:hover { background: var(--verde-hover); }
  .capas a:focus-visible { outline: 3px solid var(--foco); outline-offset: 3px; }
  .capas svg { flex: none; width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .capas .texto { display: flex; flex-direction: column; line-height: 1.25; }
  .capas .titulo { font-weight: 600; font-size: 17px; }
  .capas .detalle { font-size: 14px; color: var(--sobre-verde-suave); }

  footer { margin-top: 32px; text-align: center; font-size: 14px; color: var(--texto-suave); }
  footer p { margin: 0 0 4px; }

  /* Un solo momento de movimiento: las capas se "imprimen" al cargar. */
  @media (prefers-reduced-motion: no-preference) {
    .capas a { animation: imprimir 420ms cubic-bezier(.2,.7,.2,1) both; }
    .capas li:nth-child(2) a { animation-delay: 70ms; }
    .capas li:nth-child(3) a { animation-delay: 140ms; }
    .capas li:nth-child(4) a { animation-delay: 210ms; }
    .capas li:nth-child(5) a { animation-delay: 280ms; }
    .capas li:nth-child(6) a { animation-delay: 350ms; }
    @keyframes imprimir {
      from { transform: scaleX(0.04); opacity: 0.4; }
      to   { transform: scaleX(1); opacity: 1; }
    }
  }
